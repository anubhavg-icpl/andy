<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="ANDY session">
  <defs>
    <clipPath id="tframe"><rect x="0" y="0" width="1100" height="470" rx="14"/></clipPath>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    /* Opacity is never animated: a staggered fade would leave every line
       invisible during its own delay — exactly what a renderer that ignores
       animation (or samples frame zero) would show. Only the slide moves. */
    .ln { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; animation: rise .5s ease-out backwards; }
    @keyframes rise { from { transform: translateY(8px); } to { transform: translateY(0); } }
    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .title { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #ece9e4; }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; } .cur { animation: none; }
    }
  </style>

  <g clip-path="url(#tframe)">
    <rect width="1100" height="470" fill="#0e1116"/>
    <rect width="1100" height="46" fill="#151a21"/>
    <circle cx="28" cy="23" r="6.5" fill="#ff5f57"/>
    <circle cx="50" cy="23" r="6.5" fill="#febc2e"/>
    <circle cx="72" cy="23" r="6.5" fill="#28c840"/>
    <text class="title" x="550" y="28" text-anchor="middle">andy — shell</text>
    <line x1="0" y1="46" x2="1100" y2="46" stroke="#2a313c"/>

    <text x="36" y="78" fill="#5c6470" style="font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.2px">
      ◆ ANDY · [AUTO] · ● deepseek-v4.1-flash · ▸ ~/work/api · scope off · sandbox on
    </text>

  <text class="ln" x="36" y="112" fill="#ece9e4" style="animation-delay:0.55s">› map every route this API exposes, then write it up</text>
  <text class="ln" x="36" y="140" fill="#7c8592" style="animation-delay:1.05s" font-style="italic">  ✻ thinking  (+31 earlier)</text>
  <text class="ln" x="36" y="164" fill="#7c8592" style="animation-delay:1.25s" font-style="italic">  openapi.json in /public is stale — grep the handlers instead…</text>
  <text class="ln" x="36" y="196" fill="#f2a56b" style="animation-delay:1.75s">$ bash  grep -rhoE "@(Get|Post|Put|Delete)\('[^']+" src/</text>
  <text class="ln" x="36" y="224" fill="#ece9e4" style="animation-delay:2.25s">  ✓ 47 routes · 6 auth-gated · 2 admin · 1 upload</text>
  <text class="ln" x="36" y="256" fill="#f2a56b" style="animation-delay:2.85s">$ write_file  findings/routes.md</text>
  <text class="ln" x="36" y="284" fill="#ece9e4" style="animation-delay:3.35s">  ✓ diff applied  +61 −0</text>
  <text class="ln" x="36" y="316" fill="#f5b25e" style="animation-delay:3.95s">$ turn 3 · iter 7 · $0.0142 · 18.4k tok</text>

    <rect class="cur" x="38" y="338" width="9" height="17" fill="#ece9e4" filter="url(#tglow)"/>

    <line x1="0" y1="424" x2="1100" y2="424" stroke="#2a313c"/>
    <text x="36" y="448" fill="#5c6470" style="font:13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      ● deepseek-v4.1-flash · tok ↑18.4k ↓612 · $ 0.0142 · turn 3 · 00:47 · ● idle
    </text>
    <rect x="0.5" y="0.5" width="1099" height="469" rx="14" fill="none" stroke="#2a313c"/>
  </g>
</svg>
