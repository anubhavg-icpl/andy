<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="ANDY">
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ece9e4"/>
      <stop offset="100%" stop-color="#a8a39b"/>
    </linearGradient>
    <linearGradient id="emberline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8843c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8843c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8843c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8843c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8843c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8843c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="460" rx="12"/></clipPath>
  </defs>

  <style>
    /* Base state fully visible — the pulse only breathes, never hides. */
    .ltr { fill: url(#bone); animation: breathe 4.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.82; } }

    .rule { animation: ember 4.6s ease-in-out infinite; }
    @keyframes ember { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-140px); } 100% { transform: translateY(600px); } }

    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .tag  { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3.4px; fill: #ece9e4;
             paint-order: stroke; stroke: #0e1116; stroke-width: 6; stroke-linejoin: round; }
    .meta { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.8px; fill: #5c6470; }

    @media (prefers-reduced-motion: reduce) {
      .ltr, .rule, .scan, .cur { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="#0e1116"/>
