name: ci

# Runs on every push and PR. Build/test/typecheck only — never publishes
# anything. The release workflow (release.yml) is the only one with publish
# rights, and it gates on a protected environment requiring manual approval.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
